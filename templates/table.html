<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Job Analysis - Results</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100vh; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        
         
        .main-container { 
            display: flex; 
            height: 100%; 
            width: 100%; 
            background: linear-gradient(to right, #ffffff 50%, #9b5de5 50%); 
        }

        .content-area {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        
        .results-card {
            background-color: #051630; 
            color: white; 
            padding: 25px; 
            border-radius: 15px;
            width: 95%; /* Increased from 80% to 95% */
            max-width: 1400px; /* Increased to allow more columns to show */
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.6);
            border: 1px solid #1e293b;
        }

        h2 { 
            text-align: center; 
            color: #38bdf8; 
            margin-bottom: 20px; 
            font-size: 1.5rem; 
            letter-spacing: 1px;
        }

        
        .table-wrapper {
            width: 100%;
            overflow-x: auto; /* Horizontal scroll for many columns */
            border-radius: 8px;
        }

        .table { 
            width: 100%; 
            border-collapse: collapse; 
            color: white; 
            font-size: 0.95rem; /* Increased font size */
        }

        .table th { 
            background-color: #38bdf8; 
            color: #051630; 
            padding: 18px; /* More padding for a bigger look */
            text-align: left; 
            font-weight: 800;
        }

        .table td { 
            padding: 15px; 
            border-bottom: 1px solid #1e293b; 
            background-color: #051630;
        }

        .table tr:hover td { 
            background-color: #162447; 
        }

        
        .back-btn-container {
            margin-top: 30px;
        }

        .back-btn {
            background-color: #38bdf8; 
            color: #051630; 
            padding: 14px 45px;
            text-decoration: none; 
            font-weight: 900; 
            border-radius: 8px;
            text-transform: uppercase; 
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: inline-block;
        }

        .back-btn:hover { 
            background-color: #ffffff; 
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="content-area">
            <div class="results-card">
                <h2>Filtered Job Data</h2>
                <div class="table-wrapper">
                    {{ tables | safe }}
                </div>
            </div>

            <div class="back-btn-container">
                <a href="/" class="back-btn">← Back to Search</a>
            </div>
        </div>
    </div>
</body>
</html>
